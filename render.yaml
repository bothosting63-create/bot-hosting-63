services:
  - type: web
    name: krutik-cyber-host
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot_host.py
    healthCheckPath: /
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_CHAT_ID
        sync: false
      - key: DATA_DIR
        sync: false
